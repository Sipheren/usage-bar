<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu bar options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#2563A8}a:hover{color:#1E4F86}
</style>
</helmet>
<div style="width: 1160px; height: 720px; box-sizing: border-box; padding: 48px 56px; background: #F2F2F4; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #1D1D1F; display: flex; flex-direction: column; gap: 28px">
  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em">Menu bar options</h1>
    <p style="margin: 0; font-size: 14px; color: #55555A">P = Personal, W = Work. First number is the 5-hour session, second is weekly. Sample data.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{ rows }}" as="row" hint-placeholder-count="6">
      <div style="display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; align-items: center; padding: 14px 16px; background: #FFFFFF; border-radius: 12px; border: 1px solid #E3E3E7">
        <div style="display: flex; flex-direction: column; gap: 3px">
          <div style="font-size: 15px; font-weight: 600">{{ row.title }}</div>
          <div style="font-size: 13px; color: #55555A">{{ row.desc }}</div>
        </div>
        <div style="height: 34px; border-radius: 8px; padding: 0 14px; display: flex; align-items: center; justify-content: flex-end; gap: 16px; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; background: {{ barBg }}; color: {{ barFg }}">
          <div style="display: flex; align-items: center; gap: 9px; padding: 3px 8px; border-radius: 6px; background: {{ itemBg }}">
            <sc-if value="{{ row.isIcon }}" hint-placeholder-val="{{ false }}">
              <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><line x1="8" y1="1.6" x2="8" y2="14.4"></line><line x1="1.6" y1="8" x2="14.4" y2="8"></line><line x1="3.5" y1="3.5" x2="12.5" y2="12.5"></line><line x1="12.5" y1="3.5" x2="3.5" y2="12.5"></line></g></svg>
            </sc-if>
            <sc-if value="{{ row.isPct }}" hint-placeholder-val="{{ false }}">
              <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><line x1="8" y1="1.6" x2="8" y2="14.4"></line><line x1="1.6" y1="8" x2="14.4" y2="8"></line><line x1="3.5" y1="3.5" x2="12.5" y2="12.5"></line><line x1="12.5" y1="3.5" x2="3.5" y2="12.5"></line></g></svg>
              <span style="display: inline-flex; align-items: center; gap: 4px"><span style="display: inline-flex; align-items: center; justify-content: center; min-width: 13px; height: 13px; padding: 0 2px; box-sizing: border-box; border: 1.2px solid currentColor; border-radius: 3px; font-size: 9px; font-weight: 700; line-height: 1">P</span>20%/60%</span>
              <span style="display: inline-flex; align-items: center; gap: 4px"><span style="display: inline-flex; align-items: center; justify-content: center; min-width: 13px; height: 13px; padding: 0 2px; box-sizing: border-box; border: 1.2px solid currentColor; border-radius: 3px; font-size: 9px; font-weight: 700; line-height: 1">W</span>45%/72%</span>
            </sc-if>
            <sc-if value="{{ row.isNum }}" hint-placeholder-val="{{ false }}">
              <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><line x1="8" y1="1.6" x2="8" y2="14.4"></line><line x1="1.6" y1="8" x2="14.4" y2="8"></line><line x1="3.5" y1="3.5" x2="12.5" y2="12.5"></line><line x1="12.5" y1="3.5" x2="3.5" y2="12.5"></line></g></svg>
              <span style="display: inline-flex; align-items: center; gap: 4px"><span style="display: inline-flex; align-items: center; justify-content: center; min-width: 13px; height: 13px; padding: 0 2px; box-sizing: border-box; border: 1.2px solid currentColor; border-radius: 3px; font-size: 9px; font-weight: 700; line-height: 1">P</span>20·60</span>
              <span style="display: inline-flex; align-items: center; gap: 4px"><span style="display: inline-flex; align-items: center; justify-content: center; min-width: 13px; height: 13px; padding: 0 2px; box-sizing: border-box; border: 1.2px solid currentColor; border-radius: 3px; font-size: 9px; font-weight: 700; line-height: 1">W</span>45·72</span>
            </sc-if>
            <sc-if value="{{ row.isBars }}" hint-placeholder-val="{{ false }}">
              <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><line x1="8" y1="1.6" x2="8" y2="14.4"></line><line x1="1.6" y1="8" x2="14.4" y2="8"></line><line x1="3.5" y1="3.5" x2="12.5" y2="12.5"></line><line x1="12.5" y1="3.5" x2="3.5" y2="12.5"></line></g></svg>
              <span style="display: inline-flex; align-items: center; gap: 4px">
                <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 13px; height: 13px; padding: 0 2px; box-sizing: border-box; border: 1.2px solid currentColor; border-radius: 3px; font-size: 9px; font-weight: 700; line-height: 1">P</span>
                <span style="display: inline-flex; flex-direction: column; gap: 2px">
                  <span style="display: block; width: 26px; height: 4px; border-radius: 2px; overflow: hidden; background: {{ track }}"><span style="display: block; width: 20%; height: 100%; background: currentColor"></span></span>
                  <span style="display: block; width: 26px; height: 4px; border-radius: 2px; overflow: hidden; background: {{ track }}"><span style="display: block; width: 60%; height: 100%; background: currentColor"></span></span>
                </span>
              </span>
              <span style="display: inline-flex; align-items: center; gap: 4px">
                <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 13px; height: 13px; padding: 0 2px; box-sizing: border-box; border: 1.2px solid currentColor; border-radius: 3px; font-size: 9px; font-weight: 700; line-height: 1">W</span>
                <span style="display: inline-flex; flex-direction: column; gap: 2px">
                  <span style="display: block; width: 26px; height: 4px; border-radius: 2px; overflow: hidden; background: {{ track }}"><span style="display: block; width: 45%; height: 100%; background: currentColor"></span></span>
                  <span style="display: block; width: 26px; height: 4px; border-radius: 2px; overflow: hidden; background: {{ track }}"><span style="display: block; width: 72%; height: 100%; background: currentColor"></span></span>
                </span>
              </span>
            </sc-if>
            <sc-if value="{{ row.isOne }}" hint-placeholder-val="{{ false }}">
              <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><line x1="8" y1="1.6" x2="8" y2="14.4"></line><line x1="1.6" y1="8" x2="14.4" y2="8"></line><line x1="3.5" y1="3.5" x2="12.5" y2="12.5"></line><line x1="12.5" y1="3.5" x2="3.5" y2="12.5"></line></g></svg>
              <span>45% · 72%</span>
            </sc-if>
            <sc-if value="{{ row.isWarn }}" hint-placeholder-val="{{ false }}">
              <span style="display: inline-flex; color: {{ warn }}"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><line x1="8" y1="1.6" x2="8" y2="14.4"></line><line x1="1.6" y1="8" x2="14.4" y2="8"></line><line x1="3.5" y1="3.5" x2="12.5" y2="12.5"></line><line x1="12.5" y1="3.5" x2="3.5" y2="12.5"></line></g></svg></span>
              <span style="display: inline-flex; align-items: center; gap: 4px"><span style="display: inline-flex; align-items: center; justify-content: center; min-width: 13px; height: 13px; padding: 0 2px; box-sizing: border-box; border: 1.2px solid currentColor; border-radius: 3px; font-size: 9px; font-weight: 700; line-height: 1">P</span>20·60</span>
              <span style="display: inline-flex; align-items: center; gap: 4px"><span style="display: inline-flex; align-items: center; justify-content: center; min-width: 13px; height: 13px; padding: 0 2px; box-sizing: border-box; border: 1.2px solid currentColor; border-radius: 3px; font-size: 9px; font-weight: 700; line-height: 1">W</span><span style="font-weight: 700; color: {{ warn }}">83</span>·<span style="font-weight: 700; color: #FFFFFF; padding: 1px 4px; border-radius: 4px; background: {{ pill }}">96</span></span>
            </sc-if>
          </div>
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 6.2a8.5 8.5 0 0 1 12 0"></path><path d="M4.2 8.6a5.3 5.3 0 0 1 7.6 0"></path><path d="M6.4 11a2.2 2.2 0 0 1 3.2 0"></path></g><circle cx="8" cy="13.2" r="1" fill="currentColor"></circle></svg>
          <svg width="24" height="16" viewBox="0 0 24 16" aria-hidden="true"><rect x="1" y="4" width="19" height="9" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.2"></rect><rect x="2.8" y="5.8" width="12" height="5.4" rx="1.2" fill="currentColor"></rect><path d="M21.6 6.8v3.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path></svg>
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.5" y="2.5" width="13" height="4.5" rx="2.25"></rect><rect x="1.5" y="9" width="13" height="4.5" rx="2.25"></rect></g><circle cx="11.9" cy="4.75" r="1.4" fill="currentColor"></circle><circle cx="4.1" cy="11.25" r="1.4" fill="currentColor"></circle></svg>
          <span>Sun 25 Oct  5:41 pm</span>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1160,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const kinds = [
      { kind: 'icon', title: 'Icon only', desc: 'Just the mark. Turns orange if any account passes 80%.' },
      { kind: 'pct', title: 'Both accounts, with %', desc: 'Your layout: session % / weekly % per account.' },
      { kind: 'num', title: 'Both accounts, compact', desc: 'Same numbers without the % signs, about a third narrower.' },
      { kind: 'bars', title: 'Both accounts, mini bars', desc: 'Session bar on top, weekly below, per account.' },
      { kind: 'one', title: 'One account', desc: 'Untick the other account in Settings.' },
      { kind: 'warn', title: 'Near a limit', desc: '80%+ turns orange, 95%+ gets a red pill.' }
    ];
    return {
      rows: kinds.map((k) => ({
        ...k,
        isIcon: k.kind === 'icon',
        isPct: k.kind === 'pct',
        isNum: k.kind === 'num',
        isBars: k.kind === 'bars',
        isOne: k.kind === 'one',
        isWarn: k.kind === 'warn'
      })),
      barBg: dark ? '#1C1C1E' : '#E6E6E9',
      barFg: dark ? '#F5F5F7' : '#1D1D1F',
      itemBg: dark ? 'rgba(255,255,255,0.14)' : 'rgba(0,0,0,0.08)',
      track: dark ? 'rgba(255,255,255,0.28)' : 'rgba(0,0,0,0.18)',
      warn: dark ? '#FDBA74' : '#9A4407',
      pill: dark ? '#DC2626' : '#B91C1C'
    };
  }
}
</script>
</body>
</html>
